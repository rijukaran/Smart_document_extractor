name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare App Files
        run: |
          if [ -d "android" ]; then
            echo "Copying files from android/ to root..."
            cp -r android/* . 2>/dev/null || true
          fi
          echo "=== Root Directory Files ==="
          ls -la

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDocExtractor-Android-APK
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 14
