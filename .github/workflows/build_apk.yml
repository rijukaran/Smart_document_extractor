name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer "cython<3.0" virtualenv

      - name: Build Android APK
        run: |
          if [ -f "buildozer.spec" ]; then
            echo "Found buildozer.spec in repository root"
            buildozer android debug
          elif [ -f "android/buildozer.spec" ]; then
            echo "Found buildozer.spec in android folder"
            cd android
            buildozer android debug
          else
            echo "ERROR: buildozer.spec not found in root or android/ folder!"
            echo "Please make sure you have uploaded buildozer.spec, main.py, and extractor_core.py."
            exit 1
          fi

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDocExtractor-Android-APK
          path: |
            bin/*.apk
            android/bin/*.apk
          retention-days: 14
