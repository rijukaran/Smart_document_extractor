name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev cython3

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv

      - name: Build Android APK
        run: |
          if [ -f "android/buildozer.spec" ]; then
            cd android
          fi
          buildozer android debug

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDocExtractor-Android-APK
          path: |
            bin/*.apk
            android/bin/*.apk
          retention-days: 14
